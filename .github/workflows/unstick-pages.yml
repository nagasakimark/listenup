name: Pagesの止まったデプロイを解除 (Unstick Pages)

on:
  push:
    branches: [main]
    paths: ['.github/unstick-pages.txt']
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 止まっているデプロイをキャンセルして、ビルドをやり直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(grep -v '^#' .github/unstick-pages.txt | head -1 | tr -d '[:space:]')
          echo "cancel deployment: $id"
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$id/cancel" || echo "cancel failed"
          sleep 25
          echo "request new Pages build"
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "build request failed"
